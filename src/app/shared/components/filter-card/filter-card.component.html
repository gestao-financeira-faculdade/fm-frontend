<form class="mb-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm" (ngSubmit)="filtrar.emit()">
  <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-slate-700">
    <i class="pi pi-filter"></i>
    {{ titulo() }}
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <ng-content />
  </div>

  <div class="mt-4 flex justify-end gap-2">
    <p-button
      type="button"
      label="Limpar"
      icon="pi pi-filter-slash"
      severity="secondary"
      [text]="true"
      (onClick)="limpar.emit()"
    />
    <p-button type="submit" label="Filtrar" icon="pi pi-search" [loading]="carregando()" />
  </div>
</form>
