@if (linhas().length === 0) {
  <p class="m-0 text-sm text-slate-500">Sem snapshot de estado.</p>
} @else {
  <div class="overflow-x-auto">
    <table class="w-full border-collapse text-xs">
      <thead>
        <tr class="text-left text-slate-500">
          <th class="border-b border-slate-200 px-2 py-1.5 font-medium">Campo</th>
          <th class="border-b border-slate-200 px-2 py-1.5 font-medium">Antes</th>
          <th class="border-b border-slate-200 px-2 py-1.5 font-medium">Depois</th>
        </tr>
      </thead>
      <tbody>
        @for (l of linhas(); track l.campo) {
          <tr [class.bg-amber-50]="l.alterado">
            <td class="border-b border-slate-100 px-2 py-1.5 font-mono text-slate-600">{{ l.campo }}</td>
            <td class="break-all border-b border-slate-100 px-2 py-1.5 font-mono" [class.text-red-700]="l.alterado">
              {{ l.antes }}
            </td>
            <td class="break-all border-b border-slate-100 px-2 py-1.5 font-mono" [class.text-emerald-700]="l.alterado">
              {{ l.depois }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
