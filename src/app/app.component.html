<router-outlet />

<p-toast position="top-right" styleClass="toast-global" />
<p-toast key="pwa" position="bottom-center">
  <ng-template let-message #message>
    <div class="flex w-full items-center gap-3">
      <i class="pi pi-refresh text-xl"></i>
      <div class="flex-1">
        <div class="font-semibold">{{ message.summary }}</div>
        <div class="text-sm">{{ message.detail }}</div>
      </div>
      <p-button label="Atualizar" size="small" (onClick)="pwaUpdate.recarregar()" />
    </div>
  </ng-template>
</p-toast>
<p-confirmDialog [style]="{ width: '28rem' }" />
