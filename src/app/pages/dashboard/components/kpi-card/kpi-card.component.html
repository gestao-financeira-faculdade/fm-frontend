<div class="h-full rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <span class="text-sm font-medium text-slate-500">{{ titulo() }}</span>
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" [class]="classesIcone()">
      <i [class]="icone()"></i>
    </span>
  </div>
  @if (carregando()) {
    <p-skeleton height="2rem" width="70%" styleClass="mt-2" />
  } @else {
    <div class="valor-monetario mt-1 text-2xl font-semibold text-slate-900">{{ valor() ?? '—' }}</div>
  }
  @if (legenda()) {
    <div class="mt-1 text-xs text-slate-500">{{ legenda() }}</div>
  }
</div>
