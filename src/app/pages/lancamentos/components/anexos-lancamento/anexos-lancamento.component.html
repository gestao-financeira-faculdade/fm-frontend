<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <p class="m-0 text-sm text-slate-500">PDF, JPEG ou PNG, até 10 MB. Armazenados com verificação de assinatura binária.</p>
  @if (podeAnexar()) {
    <p-fileupload
      #upload
      mode="basic"
      chooseLabel="Anexar comprovante"
      chooseIcon="pi pi-upload"
      [accept]="accept"
      [auto]="false"
      [customUpload]="true"
      [disabled]="progresso() !== null"
      (onSelect)="aoSelecionar($event, upload)"
    />
  }
</div>

@if (progresso() !== null) {
  <p-progressbar [value]="progresso()!" styleClass="mb-4 h-2" [showValue]="false" />
}

<p-table [value]="anexos()" [loading]="carregando()" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Arquivo</th>
      <th>Tamanho</th>
      <th>Enviado em</th>
      <th class="w-16"></th>
    </tr>
  </ng-template>
  <ng-template #body let-anexo>
    <tr>
      <td>
        <span class="flex items-center gap-2">
          <i [class]="icone(anexo)"></i>
          <span class="font-medium text-slate-800">{{ nome(anexo) }}</span>
        </span>
      </td>
      <td>{{ tamanho(anexo) | tamanhoArquivo }}</td>
      <td>{{ data(anexo) | date: 'dd/MM/yyyy HH:mm' }}</td>
      <td class="text-right">
        <p-button
          icon="pi pi-download"
          [text]="true"
          [rounded]="true"
          [loading]="baixando() === anexo.id"
          pTooltip="Baixar"
          ariaLabel="Baixar anexo"
          (onClick)="baixar(anexo)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state icone="pi pi-paperclip" titulo="Nenhum comprovante anexado" />
      </td>
    </tr>
  </ng-template>
</p-table>
