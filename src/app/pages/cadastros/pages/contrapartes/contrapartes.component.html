<app-page-header titulo="Contrapartes" subtitulo="Clientes e fornecedores" icone="pi pi-users">
  <p-button
    *appPermissao="permissoes.criarContraparte"
    label="Nova contraparte"
    icon="pi pi-plus"
    (onClick)="dialogAberto.set(true)"
  />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <p-table
    #dt
    [value]="contrapartes()"
    [loading]="carregando()"
    [globalFilterFields]="['legalName', 'tradeName', 'taxId']"
    sortField="legalName"
    [sortOrder]="1"
    [rowHover]="true"
    [paginator]="contrapartes().length > 20"
    [rows]="20"
    dataKey="id"
  >
    <ng-template #caption>
      <div class="flex justify-end">
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Nome ou documento"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th pSortableColumn="legalName">Razão social <p-sortIcon field="legalName" /></th>
        <th pSortableColumn="tradeName">Nome fantasia <p-sortIcon field="tradeName" /></th>
        <th>CPF / CNPJ</th>
        <th pSortableColumn="counterpartyType">Tipo <p-sortIcon field="counterpartyType" /></th>
        <th>Situação</th>
      </tr>
    </ng-template>
    <ng-template #body let-cp>
      <tr>
        <td class="font-medium text-slate-900">{{ cp.legalName }}</td>
        <td>{{ cp.tradeName || '—' }}</td>
        <td class="font-mono text-sm">{{ cp.taxId | cpfCnpj }}</td>
        <td>{{ tipoLabel[cp.counterpartyType] || cp.counterpartyType }}</td>
        <td>
          <p-tag [value]="cp.active === false ? 'Inativa' : 'Ativa'" [severity]="cp.active === false ? 'secondary' : 'success'" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">@if (contrapartes().length) {
            <app-empty-state icone="pi pi-search" titulo="Nenhuma contraparte corresponde à busca" mensagem="Revise o termo pesquisado." />
          } @else {
            <app-empty-state icone="pi pi-users" titulo="Nenhuma contraparte cadastrada" />
          }</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-contraparte-form-dialog [(visivel)]="dialogAberto" (salvo)="carregar()" />
