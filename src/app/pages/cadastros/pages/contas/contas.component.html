<app-page-header titulo="Contas financeiras" subtitulo="Contas bancárias e livros-razão operacionais" icone="pi pi-building-columns">
  <p-button *appPermissao="permissoes.criarConta" label="Nova conta" icon="pi pi-plus" (onClick)="dialogAberto.set(true)" />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <p-table
    #dt
    [value]="contas()"
    [loading]="carregando()"
    [globalFilterFields]="['name', 'accountType', 'currency']"
    sortField="name"
    [sortOrder]="1"
    [rowHover]="true"
    dataKey="id"
  >
    <ng-template #caption>
      <div class="flex justify-end">
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" placeholder="Buscar" (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nome <p-sortIcon field="name" /></th>
        <th pSortableColumn="accountType">Tipo <p-sortIcon field="accountType" /></th>
        <th class="text-right" pSortableColumn="initialBalance">Saldo inicial <p-sortIcon field="initialBalance" /></th>
        <th class="text-right">Saldo atual</th>
        <th>Moeda</th>
        <th>Situação</th>
      </tr>
    </ng-template>
    <ng-template #body let-conta>
      <tr>
        <td class="font-medium text-slate-900">{{ conta.name }}</td>
        <td>{{ tipoLabel[conta.accountType] || conta.accountType }}</td>
        <td class="valor-monetario text-right">{{ conta.initialBalance | moeda: conta.currency }}</td>
        <td class="valor-monetario text-right">{{ conta.currentBalance | moeda: conta.currency }}</td>
        <td>{{ conta.currency }}</td>
        <td>
          <p-tag [value]="conta.active === false ? 'Inativa' : 'Ativa'" [severity]="conta.active === false ? 'secondary' : 'success'" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6">
          @if (contas().length) {
            <app-empty-state icone="pi pi-search" titulo="Nenhuma conta corresponde à busca" mensagem="Revise o termo pesquisado." />
          } @else {
            <app-empty-state icone="pi pi-building-columns" titulo="Nenhuma conta cadastrada" />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-conta-form-dialog [(visivel)]="dialogAberto" (salvo)="carregar()" />
