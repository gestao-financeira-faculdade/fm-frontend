<app-page-header titulo="Categorias" subtitulo="Classificação de receitas e despesas" icone="pi pi-tags">
  <p-button
    *appPermissao="permissoes.criarCategoria"
    label="Nova categoria"
    icon="pi pi-plus"
    (onClick)="dialogAberto.set(true)"
  />
</app-page-header>

<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <p-table
    #dt
    [value]="categorias()"
    [loading]="carregando()"
    [globalFilterFields]="['name']"
    sortField="name"
    [sortOrder]="1"
    [rowHover]="true"
    dataKey="id"
  >
    <ng-template #caption>
      <div class="flex justify-end">
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" placeholder="Buscar" (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nome <p-sortIcon field="name" /></th>
        <th pSortableColumn="categoryType">Tipo <p-sortIcon field="categoryType" /></th>
        <th>Comprovante obrigatório</th>
        <th>Custo fixo</th>
        <th>Situação</th>
      </tr>
    </ng-template>
    <ng-template #body let-cat>
      <tr>
        <td class="font-medium text-slate-900">{{ cat.name }}</td>
        <td>
          <p-tag [value]="tipoLabel[cat.categoryType]" [severity]="cat.categoryType === 'PAYABLE' ? 'danger' : 'success'" />
        </td>
        <td>
          @if (cat.requiresAttachmentAlways) {
            <i class="pi pi-paperclip text-alerta" pTooltip="Liquidação exige anexo fiscal"></i> Sim
          } @else {
            <span class="text-slate-400">Não</span>
          }
        </td>
        <td>{{ cat.fixedCost ? 'Sim' : 'Não' }}</td>
        <td>
          <p-tag [value]="cat.active === false ? 'Inativa' : 'Ativa'" [severity]="cat.active === false ? 'secondary' : 'success'" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5"><app-empty-state icone="pi pi-tags" titulo="Nenhuma categoria cadastrada" /></td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-categoria-form-dialog [(visivel)]="dialogAberto" (salvo)="carregar()" />
